[project]
name = "square-root-decomposition"
version = "0.1.0"
description = "A block-based array decomposition supporting point updates and range aggregate queries in O(sqrt n) without preprocessing overhead constraints."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
